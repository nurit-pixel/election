x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # תהליך רקע: ריצה לילית, רשימות סניפים, geocoding, וטעינת מחירים לפי בקשות מהאפליקציה
  ingest:
    logging: *logging
    build: ./ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DUMPS_DIR: /data/dumps
      SCHEMA_DIR: /schema
      INGEST_ALL_STORES: ${INGEST_ALL_STORES:-false}
      REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-1}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-supermarket-basket-compare/0.2}
      GEOCODER_DELAY_SECONDS: ${GEOCODER_DELAY_SECONDS:-1.5}
      ALERT_CHANGE_PCT: ${ALERT_CHANGE_PCT:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      APP_URL: ${APP_URL:-}
      NIGHTLY_TIME: ${NIGHTLY_TIME:-06:00}
      RETENTION_DAYS: ${RETENTION_DAYS:-60}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - dumps:/data/dumps
      - ./db/init:/schema:ro

  web:
    logging: *logging
    build: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STALE_PRICE_HOURS: ${STALE_PRICE_HOURS:-36}
      DEFAULT_RADIUS_KM: ${DEFAULT_RADIUS_KM:-5}
      SPLIT_MIN_SAVING: ${SPLIT_MIN_SAVING:-20}
      NIGHTLY_TIME: ${NIGHTLY_TIME:-06:00}
      FAMILY_PASSWORD: ${FAMILY_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RECEIPT_MODEL: ${RECEIPT_MODEL:-}
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  dumps:
