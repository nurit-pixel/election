services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # טעינת נתונים. שלב 1: הרצה ידנית –  docker compose run --rm ingest
  ingest:
    build: ./ingest
    profiles: ["ingest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DUMPS_DIR: /data/dumps
      SCHEMA_DIR: /schema
      INGEST_ALL_STORES: ${INGEST_ALL_STORES:-false}
      SHUFERSAL_STORE_IDS: ${SHUFERSAL_STORE_IDS:-}
      REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-1}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - dumps:/data/dumps
      - ./db/init:/schema:ro

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STALE_PRICE_HOURS: ${STALE_PRICE_HOURS:-36}
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  dumps:
