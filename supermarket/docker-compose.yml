services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # תהליך רקע: רשימות סניפים, geocoding, וטעינת מחירים לפי בקשות מהאפליקציה
  ingest:
    build: ./ingest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DUMPS_DIR: /data/dumps
      SCHEMA_DIR: /schema
      INGEST_ALL_STORES: ${INGEST_ALL_STORES:-false}
      REQUEST_DELAY_SECONDS: ${REQUEST_DELAY_SECONDS:-1}
      GEOCODER_URL: ${GEOCODER_URL:-https://nominatim.openstreetmap.org/search}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-supermarket-basket-compare/0.2}
      GEOCODER_DELAY_SECONDS: ${GEOCODER_DELAY_SECONDS:-1.5}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - dumps:/data/dumps
      - ./db/init:/schema:ro

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STALE_PRICE_HOURS: ${STALE_PRICE_HOURS:-36}
      DEFAULT_RADIUS_KM: ${DEFAULT_RADIUS_KM:-5}
      SPLIT_MIN_SAVING: ${SPLIT_MIN_SAVING:-20}
      FAMILY_PASSWORD: ${FAMILY_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TZ: ${TZ:-Asia/Jerusalem}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  dumps:
