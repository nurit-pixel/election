# תוספת לשרת: HTTPS עם Caddy. מריצים עם שני הקבצים:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ב-.env: APP_DOMAIN=הדומיין שלכם, WEB_BIND=127.0.0.1
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?יש להגדיר APP_DOMAIN בקובץ .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
